services:
  go-backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    image: taskflow-go-backend:latest
    container_name: taskflow-go
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow-laravel:latest
    container_name: taskflow-web
    ports:
      - "8000:8000"
    environment:
      GO_API_URL: http://go-backend:8080
      APP_URL: http://localhost:8000
    depends_on:
      go-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://127.0.0.1:8000/up') !== false;"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
